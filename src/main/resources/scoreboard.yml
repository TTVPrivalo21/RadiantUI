# ╔══════════════════════════════════════════════════════════════╗
# ║                 RadiantUI  ·  scoreboard.yml                  ║
# ╚══════════════════════════════════════════════════════════════╝
config-version: 2
# Scoreboard moderno sin números rojos (NumberFormat.blank() de Paper 1.20.3+/1.21).
# Solo se reenvían las líneas que cambian → sin lag aunque el intervalo sea corto.

enabled: true
default-on: true
update-ticks: 20
disabled-worlds: []

# Si es una lista, el título se anima recorriendo los frames en cada actualización.
title:
  - "<glyph:puppy> <white><bold>RADIANT</bold></white><white>UI</white> <glyph:star>"
  - "<glyph:puppy> <gray><bold>RADIANT</bold></gray><white>UI</white> <glyph:star>"

# Máximo 15 líneas. Mismos placeholders que el HUD + PlaceholderAPI.
lines:
  - "<gray><st>                         </st>"
  - " <glyph:paw> <gray>Jugador</gray>"
  - "   <white>{player}"
  - ""
  - " <glyph:heart> <gray>Vida</gray> <white>{health}</white><gray>/{max_health}</gray>"
  - " <glyph:star> <gray>Nivel</gray> <white>{level}</white> <gray>({xp_percent}%)</gray>"
  - " <glyph:coin> <gray>Dinero</gray> <white>{money}</white>"
  - ""
  - " <glyph:pin> <white>{x}</white><gray>,</gray> <white>{y}</white><gray>,</gray> <white>{z}</white>"
  - " <glyph:clock> <gray>Ping</gray> <white>{ping}ms</white>"
  - "<gray><st>                         </st>"
  - "  <white>★</white> <gray>tuservidor.com</gray> <white>★</white>"

# Al desactivar el scoreboard se restaura el scoreboard anterior del jugador
restore-previous: true
