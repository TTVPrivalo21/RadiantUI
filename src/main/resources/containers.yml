# ╔══════════════════════════════════════════════════════════════╗
# ║                 RadiantUI  ·  containers.yml                  ║
# ╚══════════════════════════════════════════════════════════════╝
config-version: 2

# ── Texturas vanilla re-pintadas ──
textures:
  player-inventory: true   # gui/container/inventory.png
  chests: true             # gui/container/generic_54.png (cofres simples y dobles)
  # Inventario de creativo: fondos tab_items / tab_item_search / tab_inventory,
  # pestañas superiores e inferiores (seleccionadas/no seleccionadas) y barra de scroll
  creative-inventory: true

# ── Fondos por glifo en el título (<overlay:...> + <space:px>) ──
# Se generan overlays chest_1 ... chest_6 (176px de ancho, alto según filas) que se
# dibujan encima del fondo usando la fuente. Los huecos de los slots son transparentes.
overlay:
  # Desplazamiento horizontal: el título empieza en x=8, por eso -8 alinea con el borde.
  x-offset: -8
  # Ascent de la fuente: 13 coloca la parte superior del glifo en el borde superior del menú.
  ascent: 13

# Aplicar el overlay también a cofres/barriles/shulkers normales del mundo.
vanilla-chests:
  enabled: false
  overlay: auto          # auto = chest_<filas>
  title-format: "<text>{title}"

# ── Re-skin de GUIs de otros plugins por coincidencia de título ──
# match: expresión regular contra el título en texto plano
# overlay: auto | chest_1..chest_6 | <id de custom-overlays>
# title-format: MiniMessage, {title} = título original en texto plano
skins:
  tienda:
    match: "(?i).*(tienda|shop).*"
    overlay: auto
    title-format: "<glyph:coin> <text>{title}"
  menu:
    match: "(?i).*(menu|menú).*"
    overlay: auto
    title-format: "<glyph:paw> <text>{title}"
  warps:
    match: "(?i).*warps?.*"
    overlay: auto
    title-format: "<glyph:pin> <text>{title}"

# ── Overlays propios ──
# Coloca PNGs en plugins/RadiantUI/overlays/<archivo>.png y regístralos aquí.
# Se pueden usar en skins (overlay: mi_menu) o en cualquier texto con <overlay:mi_menu:-8>.
custom-overlays: {}
