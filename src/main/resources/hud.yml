# ╔══════════════════════════════════════════════════════════════╗
# ║                     RadiantUI  ·  hud.yml                     ║
# ╚══════════════════════════════════════════════════════════════╝
config-version: 2

# ── Texturas vanilla re-pintadas en el resource pack ──
# Cada sección genera sprites pixel-art en blanco y negro del tema del jugador.
textures:
  hearts: true        # llenos, medios, vacíos, hardcore, absorción, veneno, wither, congelado, montura
  food: true          # huesitos en vez de muslos
  armor: true         # escuditos con corazón
  air: true           # burbujas
  experience: true    # barra de experiencia
  hotbar: true        # hotbar y selector

# ── HUD superior vía BossBar (glifos + placeholders) ──
# Placeholders internos:
#   {player} {health} {max_health} {hearts} {food} {food_bar} {armor} {armor_bar} {air}
#   {level} {xp_percent} {xp_bar} {x} {y} {z} {world} {money} {online} {max_online}
#   {ping} {theme} {time}
# Además funcionan los placeholders de PlaceholderAPI (%...%) si está instalado.
# Usa <space:px> para mover elementos y <overlay:id:dx> para fondos detrás del texto.
bossbar:
  enabled: true
  # Estado por defecto para jugadores que nunca usaron /ui hud
  default-on: true
  # Cada cuántos ticks se recalcula el texto (solo se reenvía si cambió)
  update-ticks: 10
  # Mundos donde el HUD no se muestra
  disabled-worlds: []
  # Hace transparente la textura de este color de BossBar para que solo se vea el texto
  hide-bar-color: WHITE
  bars:
    status:
      color: WHITE           # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
      overlay: PROGRESS      # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
      progress: FIXED        # FIXED, HEALTH, FOOD, XP, AIR
      fixed-progress: 1.0
      # Ejemplo con fondo: "<overlay:hud_panel:-4>..." dibuja un panel blanco con tinta negra de 182px detrás
      format: "{hearts}<space:6><glyph:bone> <white>{food}</white><space:6><glyph:star> <white>{level}</white><space:6><glyph:coin> <white>{money}</white>"
    location:
      color: WHITE
      overlay: PROGRESS
      progress: FIXED
      fixed-progress: 1.0
      format: "<glyph:pin> <white>{x}</white><gray>, </gray><white>{y}</white><gray>, </gray><white>{z}</white> <gray>·</gray> <glyph:paw> <white>{world}</white>"

# Iconos usados por {hearts}, {food_bar}, {armor_bar} y {xp_bar}
bars-style:
  hearts-count: 10       # cuántos corazones dibuja {hearts}
  segments: 10           # segmentos de {food_bar} {armor_bar} {xp_bar}
  heart-spacing: 0       # píxeles extra entre corazones (puede ser negativo)
