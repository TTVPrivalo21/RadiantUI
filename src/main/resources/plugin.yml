name: RadiantUI
version: '${project.version}'
main: dev.privalo.ui.RadiantUI
api-version: '1.21'
author: privalo
description: ${project.description}
website: https://github.com/privalo
softdepend: [PlaceholderAPI, Vault, Oraxen]
load: POSTWORLD

commands:
  radiantui:
    description: Panel principal de RadiantUI (temas, HUD, scoreboard, resource pack).
    usage: /<command> <theme|hud|scoreboard|pack|links|reload>
    aliases: [rui, ui]
    permission: radiantui.use

permissions:
  radiantui.use:
    description: Usar /ui.
    default: true
  radiantui.theme:
    description: Elegir tu propio tema con /ui theme <tema>.
    default: true
  radiantui.hud:
    description: Activar/desactivar tu HUD.
    default: true
  radiantui.scoreboard:
    description: Activar/desactivar tu scoreboard.
    default: true
  radiantui.pack:
    description: Volver a recibir el resource pack.
    default: true
  radiantui.admin:
    description: Recargar, cambiar el tema global, reenviar el pack o cambiar el tema de otros jugadores.
    default: op
    children:
      radiantui.use: true
      radiantui.theme: true
      radiantui.hud: true
      radiantui.scoreboard: true
      radiantui.pack: true
